<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EthosGuard AI — Governance Platform</title>
<style>
:root {
  --bg:#0b1220; --panel:#121a2b; --panel2:#182235; --line:#2a3650;
  --text:#e8eefc; --muted:#9aa8c7; --accent:#4f7cff; --accent2:#7c5cff;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
aside{width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800}
.brand h1{font-size:16px}.brand p{font-size:11px;color:var(--muted)}
nav{padding:14px;overflow:auto;flex:1}
.nav-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 8px 8px}
.nav-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:4px}
.nav-item:hover,.nav-item.active{background:var(--panel2);color:var(--text)}
.nav-item.active{box-shadow:inset 3px 0 0 var(--accent)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:64px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
header h2{font-size:18px;font-weight:650}
.header-right{display:flex;gap:10px;align-items:center}
.pill{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel2)}
.content{flex:1;overflow:auto;padding:24px}
.view{display:none}.view.active{display:block}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.g4,.g3{grid-template-columns:1fr 1fr}.aside-hide{display:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
.metric{font-size:28px;font-weight:750;margin-bottom:4px}
.sub{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;text-transform:uppercase}
.b-ok{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.35)}
.b-warn{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.35)}
.b-bad{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.35)}
.b-info{background:rgba(79,124,255,.15);color:#bfdbfe;border:1px solid rgba(79,124,255,.35)}
.b-muted{background:rgba(154,168,199,.12);color:var(--muted);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
tr:hover td{background:rgba(255,255,255,.02);cursor:pointer}
.btn{border:0;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--accent);color:white}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.meter{height:8px;background:#0f172a;border-radius:999px;overflow:hidden;margin-top:8px}
.meter>span{display:block;height:100%;border-radius:999px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(42,54,80,.6)}
.kv b{color:var(--muted);font-weight:600}
.rec{border-left:3px solid var(--accent);padding:10px 12px;background:var(--panel2);border-radius:0 10px 10px 0;font-size:13px}
.muted{color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.bar{flex:1;background:linear-gradient(180deg,var(--accent),#243356);border-radius:6px 6px 0 0;min-width:18px;position:relative}
.bar span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{width:min(820px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.modal h3{margin-bottom:12px}
.footer-note{margin-top:18px;font-size:11px;color:var(--muted)}
.slider-block{padding:10px 0;border-bottom:1px solid rgba(42,54,80,.5)}
.slider-block:last-child{border-bottom:0}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:13px}
.slider-head .val{font-weight:700;color:var(--info)}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.check-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(42,54,80,.5);font-size:13px}
.check-row:last-child{border-bottom:0}
.check-label{display:flex;flex-direction:column;gap:2px}
.flag-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-right:4px;background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.35)}
.flag-tag.bad{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.35)}
.flag-tag.ok{background:rgba(34,197,94,.15);color:#86efac;border-color:rgba(34,197,94,.35)}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4f7cff"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" href="icons/icon-192.png">
</head>
<body>
<aside>
  <div class="brand">
    <div class="mark">EG</div>
    <div>
      <h1>EthosGuard AI</h1>
      <p>Responsible AI governance</p>
    </div>
  </div>
  <nav id="nav"></nav>
</aside>
<main>
  <header>
    <h2 id="viewTitle">Overview</h2>
    <div class="header-right">
      <span class="pill">Org: Henderson Concepts</span>
      <span class="pill">Sample data · mid-market pilot</span>
      <button class="btn btn-primary" onclick="genRecs()">Generate AI recommendations</button>
    </div>
  </header>
  <div class="content">
    <section id="dashboard" class="view active"></section>
    <section id="bias" class="view"></section>
    <section id="drift" class="view"></section>
    <section id="policies" class="view"></section>
    <section id="xai" class="view"></section>
    <section id="audit" class="view"></section>
    <section id="privacy" class="view"></section>
    <section id="safety" class="view"></section>
    <section id="compliance" class="view"></section>
    <section id="provenance" class="view"></section>
    <section id="poisoning" class="view"></section>
    <section id="registry" class="view"></section>
  </div>
</main>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
const SECTIONS = [

const systems = [

];

const policies = [
  ['EG-01','Acceptable AI Use','Active','All staff'],
  ['EG-02','High-Risk System Review','Active','Risk / Legal'],
  ['EG-03','Bias Testing Standard','Active','Model owners'],
  ['EG-04','Human Oversight Policy','Draft','Ops leads'],
  ['EG-05','Incident Response for AI','Active','Security'],
  ['EG-06','Data Minimization for Models','Active','Privacy'],

const incidents = [
  ['F-104','FraudPulse false decline spike','Open','High','2026-09-05'],
  ['H-091','HireMatch gender score drift','Mitigating','Medium','2026-08-28'],
  ['C-077','SupportPilot leaked PII in draft','Closed','Low','2026-08-10'],
];

const packages = [
  ['torch','2.3.1','BSD-3','Direct','Audited'],
  ['transformers','4.44.0','Apache-2.0','Direct','Audited'],
  ['numpy','1.26.4','BSD-3','Direct','Audited'],
  ['scikit-learn','1.5.1','BSD-3','Direct','Audited'],
  ['pandas','2.2.2','BSD-3','Transitive','Audited'],
  ['requests','2.32.3','Apache-2.0','Transitive','Audited'],
  ['gpl-utils-demo','0.9.1','GPL-3.0','Transitive','Copyleft flag'],
  ['lgpl-codec','1.2.0','LGPL-2.1','Transitive','Copyleft flag'],
  ['onnxruntime','1.18.1','MIT','Direct','Audited'],
  ['cryptography','43.0.0','Apache-2.0 / BSD','Transitive','Audited'],
];

const poisonFlags = [
  ['Token-injection pattern','Quarantined','High','Synthetic prompt tokens in credit cohort batch B-17'],
  ['Coordinate poisoning (feature space)','Watch','Medium','Unusual density spike near decision boundary features'],
  ['Label flip cluster','Quarantined','High','14 rows with inverted target vs peer cohort'],
  ['Data drift safeguard','Active','Info','PSI 0.58 vs baseline — linked to Drift Telemetry'],
  ['Outlier embedding island','Cleared','Low','Reviewed; legitimate rare-segment applicants'],
];

const nistChecks = [
  ['Govern','Roles, policies, and escalation paths documented','Partial',70],
  ['Map','Use-case context, stakeholders, and harm surface inventoried','Complete',88],
  ['Measure','Bias, drift, privacy, and safety metrics collected','Partial',72],
  ['Manage','Human-gated response, incidents, and continuous improvement','Partial',66],
];

function badge(status){
  const s=(status||'').toLowerCase();
  let cls='b-muted';
  if(/compliant|approved|closed|active|pass|ok|low|audited|cleared|complete/.test(s)) cls='b-ok';
  else if(/partial|conditional|medium|mitigat|draft|review|warn|watch|copyleft/.test(s)) cls='b-warn';
  else if(/high|risk|open|fail|critical|quarantin/.test(s)) cls='b-bad';
  else if(/info|new/.test(s)) cls='b-info';
  return `<span class="badge ${cls}">${status}</span>`;
}

function meter(score, color){
  return `<div class="meter"><span style="width:${Math.min(100,Math.max(0,score))}%;background:${color}"></span></div>`;
}

function healthScore(){
  // Demo composite ~71 — influenced lightly by knobs for walkthrough feel
  const base = 71;
  const adj = Math.round((knobs.nistAlignment - 74) * 0.08 + (55 - knobs.riskTolerance) * 0.04);
  return Math.max(55, Math.min(85, base + adj));
}

function healthLabel(score){
  if(score >= 80) return 'Healthy';
  if(score >= 65) return 'Review Recommended';
  return 'Needs Audit';
}

function navRender(){
  const nav=document.getElementById('nav');
  const midMarket = new Set(['provenance','poisoning','compliance']);
  let html = `<div class="nav-label">Workspace</div>`;
  SECTIONS.forEach(([id,label],i)=>{
    if(id==='provenance') html += `<div class="nav-label">Integrity &amp; supply</div>`;
    html += `<button class="nav-item ${i===0?'active':''}" data-id="${id}">${label}</button>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-item').forEach(btn=>btn.onclick=()=>show(btn.dataset.id));
}

function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  document.getElementById('viewTitle').textContent = SECTIONS.find(s=>s[0]===id)[1];
}

function openSystem(id){
  const s=systems.find(x=>x.id===id); if(!s) return;
  const recs=recommendations(s);
  document.getElementById('modal').innerHTML = `
    <div class="row" style="justify-content:space-between">
      <h3>${s.name}</h3>
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    </div>
    <div class="stack" style="margin-top:8px">
      ${kv('Purpose',s.purpose)}
      ${kv('Owner',s.owner)}
      ${kv('Risk level',badge(s.risk))}
      ${kv('Data used',s.data.join(', '))}
      ${kv('Affected users',s.users)}
      ${kv('Review status',badge(s.review))}
      ${kv('Compliance',badge(s.compliance))}
      ${kv('Required approvals',s.approvals.join(' → '))}
      ${kv('Audit history',s.audit.join(' · '))}
      ${kv('Next review',s.nextReview)}
      ${kv('Oversight',s.oversight)}
      <h3 style="margin-top:10px">AI recommendations</h3>
      ${recs.map(r=>`<div class="rec">${r}</div>`).join('')}
    </div>`;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){document.getElementById('modalBg').classList.remove('open')}
function kv(k,v){return `<div class="kv"><b>${k}</b><div>${v}</div></div>`}

function recommendations(s){
  const out=[];
  if(s.biasScore<80) out.push('Bias: rebalance training cohorts; add counterfactual fairness tests on protected attributes before next release.');
  else out.push('Bias: maintain quarterly disparate-impact checks; document accepted thresholds.');
  if(s.risk==='High') out.push('Transparency: publish model card + decision rationale samples for auditors.');
  out.push('Privacy: enforce purpose limitation on listed data fields; expire unused features after 90 days.');
  if(!/always|required|confirm/i.test(s.oversight)) out.push('Human review: add mandatory dual-control for irreversible actions.');
  else out.push('Human review: keep current oversight; log override reasons in audit trail.');
  if(s.compliance!=='Compliant') out.push('Governance: complete missing approvals ('+s.approvals.join(', ')+') before production expansion.');
  else out.push('Governance: schedule automated evidence pack export for '+s.nextReview+'.');
  return out;
}

function genRecs(){
  const high=systems.filter(s=>s.risk==='High'||s.compliance!=='Compliant');
  if(high[0]) openSystem(high[0].id);
  // Real AI (free, keyless). The systems listed here are the sample portfolio shown in this pilot.
  if(window.AIHelper){
    const brief=high.map(s=>`${s.name}: risk ${s.risk}, compliance ${s.compliance}, bias score ${s.biasScore}, oversight "${s.oversight}"`).join('; ');
    AIHelper.open('These are the priority AI systems in my portfolio (sample data from this pilot): '+brief+'. Give 3-4 concrete, prioritised governance recommendations for each, then the single most urgent action overall.');
  } else alert('Generated '+ (high.length*4) +' recommendations across '+high.length+' priority systems. Open a system profile to view them.');
}

function updateKnob(key, val){
  knobs[key] = Number(val);
  const el = document.getElementById('knob-'+key);
  if(el) el.textContent = val + (key==='riskTolerance' || key==='nistAlignment' || key==='provenanceDepth' || key==='poisonSensitivity' ? '%' : '');
  // Live-refresh dependent panels if visible
  const hs = document.getElementById('healthScoreMetric');
  if(hs){
    const sc = healthScore();
    hs.textContent = sc;
    const hl = document.getElementById('healthScoreLabel');
    if(hl) hl.innerHTML = badge(healthLabel(sc));
    const hm = document.getElementById('healthScoreMeter');
    if(hm) hm.innerHTML = meter(sc, sc>=80?'var(--ok)':sc>=65?'var(--warn)':'var(--bad)');
  }
  const nistEl = document.getElementById('nistOverall');
  if(nistEl){
    nistEl.textContent = knobs.nistAlignment + '%';
    const nm = document.getElementById('nistOverallMeter');
    if(nm) nm.innerHTML = meter(knobs.nistAlignment, knobs.nistAlignment>=80?'var(--ok)':'var(--warn)');
  }
  const depthNote = document.getElementById('provDepthNote');
  if(depthNote) depthNote.textContent = knobs.provenanceDepth >= 80 ? 'Deep: direct + transitive + license AST' : knobs.provenanceDepth >= 50 ? 'Standard: direct + one-hop transitive' : 'Shallow: direct dependencies only';
  const sensNote = document.getElementById('poisonSensNote');
  if(sensNote) sensNote.textContent = knobs.poisonSensitivity >= 75 ? 'High sensitivity — more quarantine, more false positives' : knobs.poisonSensitivity >= 45 ? 'Balanced for mid-market ops' : 'Low sensitivity — fewer flags';
}

function sliderRow(key, label, value){
  return `<div class="slider-block">
    <div class="slider-head"><span>${label}</span><span class="val" id="knob-${key}">${value}%</span></div>
    <input type="range" min="0" max="100" value="${value}" oninput="updateKnob('${key}', this.value)" />
  </div>`;
}

function renderDashboard(){
  const sc = healthScore();
  document.getElementById('dashboard').innerHTML=`
  <div class="card" style="margin-bottom:16px">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div>
        <h3>Active segment: overview · mathematical deviation bounds</h3>
        <div class="sub">Preset: Credit Scoring LLM · Governance state Needs Audit · Mid-market corporate pilot</div>
      </div>

          <option>Credit Scoring LLM</option>

        <div id="healthScoreMeter">${meter(sc, sc>=80?'var(--ok)':sc>=65?'var(--warn)':'var(--bad)')}</div>
        <div class="sub" style="margin-top:6px">Composite of fairness, drift, provenance, and checklist alignment</div>
      </div>
      <div class="card" style="background:var(--panel2)"><h3>Composite risk</h3><div class="metric">42.3%</div>${meter(42.3,'var(--warn)')}</div>
      <div class="card" style="background:var(--panel2)"><h3>Fairness index</h3><div class="metric">82.0<span class="sub">/100</span></div>${meter(82,'var(--ok)')}</div>
      <div class="card" style="background:var(--panel2)"><h3>Engine recommendation</h3><div class="rec" style="margin:0">Extreme data drift observed relative to baseline distribution. Recommendation: queue model re-training with recent dataset anchors — <b>requires human approval</b> before execution.</div></div>

      <div><div class="sub">Data drift shift rate · 0.58</div>${meter(58,'var(--warn)')}</div>
      <div><div class="sub">Adversarial noise · 0.87</div>${meter(87,'var(--bad)')}</div>
    </div>
  </div>
  <div class="grid g2" style="margin-bottom:16px">
    <div class="card">
      <h3>Pilot knobs (demo)</h3>

        ${badge('Internal only')}
      </div>
      <div id="nistOverallMeter">${meter(knobs.nistAlignment,'var(--warn)')}</div>
      <div class="stack" style="margin-top:12px">
        ${nistChecks.map(([fn,desc,st,pct])=>`
          <div class="check-row">
            <div class="check-label"><b>${fn}</b><span class="sub">${desc}</span></div>
            <div class="row">${badge(st)} <span class="sub">${pct}%</span></div>
          </div>`).join('')}
      </div>
      <p class="footer-note">Alignment to NIST AI RMF functions (Govern / Map / Measure / Manage) as an <b>internal checklist</b> — not a legal certification, accreditation, or federal endorsement.</p>
    </div>
