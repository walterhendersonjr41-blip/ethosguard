<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EthosGuard AI — Governance Platform</title>
<style>
:root {
  --bg:#0b1220; --panel:#121a2b; --panel2:#182235; --line:#2a3650;
  --text:#e8eefc; --muted:#9aa8c7; --accent:#4f7cff; --accent2:#7c5cff;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
aside{width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800}
.brand h1{font-size:16px}.brand p{font-size:11px;color:var(--muted)}
nav{padding:14px;overflow:auto;flex:1}
.nav-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 8px 8px}
.nav-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:4px}
.nav-item:hover,.nav-item.active{background:var(--panel2);color:var(--text)}
.nav-item.active{box-shadow:inset 3px 0 0 var(--accent)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:64px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
header h2{font-size:18px;font-weight:650}
.header-right{display:flex;gap:10px;align-items:center}
.pill{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel2)}
.content{flex:1;overflow:auto;padding:24px}
.view{display:none}.view.active{display:block}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.g4,.g3{grid-template-columns:1fr 1fr}.aside-hide{display:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
.metric{font-size:28px;font-weight:750;margin-bottom:4px}
.sub{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;text-transform:uppercase}
.b-ok{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.35)}
.b-warn{background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.35)}
.b-bad{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.35)}
.b-info{background:rgba(79,124,255,.15);color:#bfdbfe;border:1px solid rgba(79,124,255,.35)}
.b-muted{background:rgba(154,168,199,.12);color:var(--muted);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
tr:hover td{background:rgba(255,255,255,.02);cursor:pointer}
.btn{border:0;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--accent);color:white}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.meter{height:8px;background:#0f172a;border-radius:999px;overflow:hidden;margin-top:8px}
.meter>span{display:block;height:100%;border-radius:999px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(42,54,80,.6)}
.kv b{color:var(--muted);font-weight:600}
.rec{border-left:3px solid var(--accent);padding:10px 12px;background:var(--panel2);border-radius:0 10px 10px 0;font-size:13px}
.muted{color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.bar{flex:1;background:linear-gradient(180deg,var(--accent),#243356);border-radius:6px 6px 0 0;min-width:18px;position:relative}
.bar span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.open{display:flex}
.modal{width:min(820px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.modal h3{margin-bottom:12px}
.footer-note{margin-top:18px;font-size:11px;color:var(--muted)}
.slider-block{padding:10px 0;border-bottom:1px solid rgba(42,54,80,.5)}
.slider-block:last-child{border-bottom:0}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:13px}
.slider-head .val{font-weight:700;color:var(--info)}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.check-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(42,54,80,.5);font-size:13px}
.check-row:last-child{border-bottom:0}
.check-label{display:flex;flex-direction:column;gap:2px}
.flag-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-right:4px;background:rgba(245,158,11,.15);color:#fcd34d;border:1px solid rgba(245,158,11,.35)}
.flag-tag.bad{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.35)}
.flag-tag.ok{background:rgba(34,197,94,.15);color:#86efac;border-color:rgba(34,197,94,.35)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px;margin-top:8px}
.hero h3{font-size:22px;color:var(--text);margin-bottom:10px}
p.big{font-size:16px;line-height:1.5;margin-bottom:8px}
.card p{line-height:1.5;font-size:14px}
.btn{min-height:40px}
.btn.big{font-size:15px;padding:12px 18px;min-height:48px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{border-color:rgba(239,68,68,.5);color:#fca5a5}
.file{display:inline-flex;align-items:center;cursor:pointer}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.file span{display:inline-block;background:var(--panel2);border:1px dashed var(--accent);color:var(--text);padding:12px 18px;border-radius:10px;font-weight:700;font-size:14px;min-height:48px}
.file:focus-within span{outline:2px solid var(--accent)}
.form{display:flex;flex-direction:column;gap:12px}
.form.grid{display:grid}
.form label,.grid.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
input:not([type=checkbox]):not([type=file]):not([type=range]),select,textarea{background:#0f172a;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;width:100%;min-height:44px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.row select{width:auto}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px}
legend{padding:0 6px;font-size:13px;color:var(--muted);font-weight:600}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
label.chk{flex-direction:row !important;align-items:center;gap:10px !important;font-weight:500 !important;color:var(--text) !important;font-size:14px !important;cursor:pointer;padding:6px 0}
.chk input,.big-check{width:22px;height:22px;accent-color:var(--accent);flex:none;cursor:pointer}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sb{justify-content:space-between;margin-bottom:8px}
.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}
tr:not(.click):hover td{cursor:default}
a{color:#93b4ff}
code{background:#0f172a;padding:1px 5px;border-radius:4px;font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:12px;font-size:14px;z-index:100;transition:transform .25s;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#menuBtn{display:none}
.pill.click{cursor:pointer}.pill.click:hover{color:var(--text);border-color:var(--accent)}
.disclaim{font-size:11px;color:var(--muted);padding:12px 22px;border-top:1px solid var(--line)}
@media(max-width:800px){
 body{display:block;height:auto;overflow:auto}
 aside{position:fixed;inset:0 25% 0 0;z-index:60;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px #000}
 body.nav-open aside{transform:none}
 main{min-height:100vh}
 header{height:auto;flex-wrap:wrap;gap:8px;padding:10px 12px;position:sticky;top:0;z-index:20}
 header h2{font-size:17px;flex:1}
 #menuBtn{display:inline-block}
 .header-right{width:100%;flex-wrap:wrap;gap:6px}
 .content{overflow:visible;padding:12px}
 .g4,.g3,.g2,.checks{grid-template-columns:1fr}
 .kv{grid-template-columns:1fr;gap:2px}
 .modal-bg{padding:0;align-items:stretch}
 .modal{max-height:100vh;height:100%;border-radius:0}
 .nav-item{font-size:15px;padding:13px 12px}
}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4f7cff"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="icon" href="icons/icon-192.png">
<meta name="description" content="Free responsible-AI governance workspace: AI system registry, bias and drift tests, privacy scanner, license checks and NIST AI RMF checklist. Runs in your browser.">
</head>
<body>
<aside>
  <div class="brand">
    <div class="mark">EG</div>
    <div>
      <h1>EthosGuard AI</h1>
      <p>Responsible AI governance</p>
    </div>
  </div>
  <nav id="nav"></nav>
  <div class="disclaim">Your data stays in this browser. Guidance only, not legal advice.</div>
</aside>
<main>
  <header>
    <button class="btn btn-ghost" id="menuBtn" aria-label="Open menu">☰ Menu</button>
    <h2 id="viewTitle">Overview</h2>
    <div class="header-right">
      <button class="pill click" id="orgPill" title="Set your organization name">Org: set your org name</button>
      <button class="btn btn-ghost" id="exportBtn" title="Download a backup of everything">⬇ Export backup</button>
      <label class="btn btn-ghost file" title="Restore from a backup file" style="padding:0"><input type="file" id="importIn" accept=".json,application/json"><span style="border:0;background:none;padding:10px 12px;min-height:0;font-size:12px">⬆ Import</span></label>
      <button class="btn btn-primary" id="recBtn">✨ AI recommendations</button>
    </div>
  </header>
  <div class="content">
    <section id="dashboard" class="view active"></section>
    <section id="bias" class="view"></section>
    <section id="drift" class="view"></section>
    <section id="policies" class="view"></section>
    <section id="xai" class="view"></section>
    <section id="audit" class="view"></section>
    <section id="privacy" class="view"></section>
    <section id="safety" class="view"></section>
    <section id="compliance" class="view"></section>
    <section id="provenance" class="view"></section>
    <section id="poisoning" class="view"></section>
    <section id="registry" class="view"></section>
  </div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
<script src="ai-helper.js"></script>
<script>AIHelper.init({"referrer": "ethosguard", "title": "🛡️ AI risk check", "color": "#4f7cff", "greeting": "Describe an AI system you use or plan to build (what it decides, what data it uses, who it affects) and I'll give a quick risk check: bias, privacy, safety, and which rules (NIST AI RMF, EU AI Act, Colorado AI Act) may apply.", "system": "You are EthosGuard's responsible-AI reviewer. For the AI system the user describes, give a short structured risk check: 1) Risk level (low/limited/high) with reason, 2) Top risks (bias, privacy, safety, transparency), 3) Which frameworks likely apply (NIST AI RMF, EU AI Act risk tier, ISO/IEC 42001, US state laws like the Colorado AI Act) and why, 4) Five concrete next steps. Ask one clarifying question if the description is too vague. Be practical and concise.", "note": "Guidance only, not legal advice.", "chips": [["Check a hiring AI", "We use an AI tool that ranks job applicants' resumes and rejects the bottom 50%. Give me a risk check."], ["Check a support chatbot", "We added an AI chatbot to answer customer support questions on our website. Give me a risk check."], ["Check my AI system", "I want a risk check on an AI system. Ask me what you need to know."]]});</script>
<script src="app.js"></script>
</body>
</html>
